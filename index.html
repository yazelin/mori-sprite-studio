    <style>
      #boot-screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: #57534e; font: 14px system-ui, sans-serif; }
      #boot-spinner { width: 24px; height: 24px; border: 3px solid #d1fae5; border-top-color: #047857; border-radius: 50%; animation: boot-spin 0.8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>

    <div id="root">
      <div id="boot-screen" role="status" aria-live="polite">
        <span id="boot-spinner" aria-hidden="true"></span>
        <strong>Mori Sprite Studio</strong>
        <span id="boot-status">正在載入工作區…</span>
